# Tes NuraHome di setiap push dan pull request.
#
# Menjalankan skrip yang sama dengan `npm run uji` di komputer pengembang:
# basis data uji dibuat ulang dari kosong, migrasi, server dev, penyedia
# pembayaran & model tiruan, lalu semua tes HTTP di skrip/uji.
#
# Tidak ada rahasia yang dipakai. Semua kunci di sini kunci PALSU khusus uji
# (lihat skrip/jalankan-uji.sh); tidak ada yang menyentuh Midtrans, penyedia
# AI, atau basis data sungguhan.
name: Uji NuraHome

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: uji-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          # Hanya untuk wadah sekali pakai ini; skrip uji tersambung tanpa sandi.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa tipe
        run: npm run typecheck

      # Sementara tidak menggagalkan CI: ada 6 galat react-hooks lama di
      # AiAssistantDrawer, PanelKunjungan, dan PanelTinjauan. Hapus baris
      # continue-on-error setelah galat itu dibereskan.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Pemeriksaan aktor & status
        run: npm run periksa

      - name: Tes HTTP
        env:
          UJI_PG: postgresql://postgres@127.0.0.1:5432/postgres
        run: bash skrip/jalankan-uji.sh

      - name: Log server (bila gagal)
        if: failure()
        run: |
          for f in /tmp/uji-server.log /tmp/uji-tiruan.log /tmp/uji-model.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"; }
          done
